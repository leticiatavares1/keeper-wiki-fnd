services:
  # Site de produção (build estático + nginx): http://localhost:8080
  # network: host porque o prerender busca a API em 127.0.0.1:8000 durante o
  # build. Para outra máquina: docker compose build --build-arg API_URL=… web
  web:
    build:
      context: .
      network: host
      args:
        API_URL: ${API_URL:-http://127.0.0.1:8000}
    ports:
      - "8080:80"

  # Desenvolvimento com hot reload: docker compose --profile dev up dev
  dev:
    profiles: [dev]
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules

volumes:
  node_modules:
