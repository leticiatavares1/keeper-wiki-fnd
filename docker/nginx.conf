server {
	listen 80;
	server_name _;
	root /usr/share/nginx/html;

	# Redirect relativo: o container escuta na 80 e não sabe a porta publicada
	# nem o domínio de fora. Com URL absoluta o navegador cairia em outra porta.
	absolute_redirect off;

	# As páginas são geradas como /gk1/semana.html; a URL pública não tem ".html".
	location / {
		try_files $uri $uri.html $uri/index.html @nivel;

		# HTML e __data.json sem cache: o build muda o conjunto de páginas, e uma
		# aba com o índice velho na memória clica em página que não existe mais.
		# Revalidar é barato (304) e evita 404 fantasma depois de cada deploy.
		add_header Cache-Control "no-cache" always;
	}

	# O nível de qualidade não tem mais página própria: os três "Abóbora" são uma
	# ficha só. Link velho — favorito, histórico, aba aberta antes do build — vai
	# para o nível certo dentro da ficha do grupo em vez de morrer em 404.
	location @nivel {
		rewrite "^(/[^/]+/itens/.+):([0-9]+)$" $1#nivel-$2 redirect;
		return 404;
	}

	# Sprite do jogo: muda só quando o jogo é atualizado e o reveng reextrai.
	location /icones/ {
		add_header Cache-Control "public, max-age=86400" always;
	}

	location /_app/immutable/ {
		add_header Cache-Control "public, max-age=31536000, immutable" always;
	}

	error_page 404 /404.html;

	gzip on;
	gzip_types text/css application/javascript image/svg+xml;
}
